name: BetaHealthCare Daily Simulation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-simulation-and-load:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      # - name: Run simulation
      #   run: python scripts/simulate_phc.py

      # - name: Load CSVs into Postgres
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #   run: python scripts/db_loader_pg.py

      - name: Send status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          subject: "BetaHealthCare Daily Simulation: ${{ job.status }}"
          body: |
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Repo: ${{ github.repository }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
